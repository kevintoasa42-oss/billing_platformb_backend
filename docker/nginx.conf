# Docker may assign a different address whenever billing_app_v3 is recreated. Keep
# the upstream name dynamically resolved instead of retaining its startup IP.
resolver 127.0.0.11 valid=10s ipv6=off;
upstream billing_php_fpm {
    zone billing_php_fpm 64k;
    server billing_app_v3:9000 resolve;
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;
    fastcgi_hide_header X-Powered-By;

    # Laravel front-controller pattern
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # REST v3 endpoints are deliberately short-lived. Slow SRI/PDF/signature
    # work is queued by Laravel and must never occupy an HTTP worker.
    location ~ ^/api/v3/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_pass billing_php_fpm;
        fastcgi_read_timeout 15s;
    }

    # PHP files -> PHP-FPM
    location ~ \.php$ {
        fastcgi_pass billing_php_fpm;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 20s;
    }

    # Deny access to hidden files (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Static asset caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Health check
    location = /up {
        try_files $uri /index.php?$query_string;
    }

    location = /health/live {
        try_files $uri /index.php?$query_string;
    }

    location = /health/ready {
        try_files $uri /index.php?$query_string;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
