# Docker Compose dedicado para Context V3.
# Solo levanta PostgreSQL con la DB master_v3 (auth + platform + core + fiscal + integration).
#
# Uso:
#   docker compose -f docker-compose.v3.yml up -d
#   docker compose -f docker-compose.v3.yml down
#
# Navicat (Windows) conecta a: localhost:5433, DB master_v3, user postgres, pass postgres
services:
  db_v3:
    image: postgres:16-alpine
    container_name: artra_db_v3
    environment:
      POSTGRES_DB: master_v3
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata_v3:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d master_v3"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata_v3:
