services:
  # ─────────────────────────────────────────────
  # PostgreSQL — BD master_v3 (auth + platform + core + fiscal + integration)
  # ─────────────────────────────────────────────
  db_v3:
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
      network: tickets_back_egress
    container_name: billing_db_v3
    environment:
      POSTGRES_MULTIPLE_DATABASES: ${MASTER_V3_DB_DATABASE:-master_v3}
      POSTGRES_DB: ${MASTER_V3_DB_DATABASE:-master_v3}
      POSTGRES_USER: ${MASTER_V3_DB_USERNAME:-billing_user}
      POSTGRES_PASSWORD: ${MASTER_V3_DB_PASSWORD:-secret}
    volumes:
      - pgdata_v3:/var/lib/postgresql/data
      - ./docker/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MASTER_V3_DB_USERNAME:-billing_user} -d ${MASTER_V3_DB_DATABASE:-master_v3}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Redis — cache for auth challenges
  # ─────────────────────────────────────────────
  challenge-redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: billing_redis_v3
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - challenge_redis_data_v3:/data
    networks:
      - challenge_cache
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # PHP-FPM — serves the V3 Laravel application
  # ─────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      network: tickets_back_egress
    container_name: billing_app_v3
    volumes:
      - .:/var/www/html
      - ./docker/openbao/runtime/app:/run/secrets/openbao:ro
    depends_on:
      db_v3:
        condition: service_healthy
      challenge-redis:
        condition: service_healthy
    networks:
      - default
      - key_custody
      - challenge_cache
    environment:
      - APP_NAME=${APP_NAME:-BillingPlatform}
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost:8080}
      - APP_KEY=${APP_KEY:-}
      - DB_CONNECTION=master_v3
      - DB_HOST=db_v3
      - DB_PORT=5432
      - DB_DATABASE=${MASTER_V3_DB_DATABASE:-master_v3}
      - DB_USERNAME=${MASTER_V3_DB_USERNAME:-billing_user}
      - DB_PASSWORD=${MASTER_V3_DB_PASSWORD:-secret}
      - MASTER_V3_DB_HOST=db_v3
      - MASTER_V3_DB_PORT=5432
      - MASTER_V3_DB_DATABASE=${MASTER_V3_DB_DATABASE:-master_v3}
      - MASTER_V3_DB_USERNAME=${MASTER_V3_DB_USERNAME:-billing_user}
      - MASTER_V3_DB_PASSWORD=${MASTER_V3_DB_PASSWORD:-secret}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-sync}
      - CACHE_STORE=${CACHE_STORE:-file}
      - SESSION_DRIVER=${SESSION_DRIVER:-cookie}
      - AUTH_CHALLENGE_CACHE_STORE=redis
      - REDIS_CLIENT=predis
      - REDIS_HOST=challenge-redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_CACHE_DB=0
      - LOG_CHANNEL=${LOG_CHANNEL:-stack}
      - LOG_LEVEL=${LOG_LEVEL:-error}
      - SRI_PROVIDER_RUC=${SRI_PROVIDER_RUC:-1752331700001}
      - SRI_MOCK=${SRI_MOCK:-true}
      - SRI_MODE=${SRI_MODE:-celcer}
      - SRI_ENVIRONMENT=${SRI_ENVIRONMENT:-staging}
      - SRI_INVOICE_XSD=${SRI_INVOICE_XSD:-/var/www/html/resources/sri/xsd/factura_V2.1.0.xsd}
      - OPENBAO_ADDR=${OPENBAO_ADDR:-http://openbao:8200}
      - OPENBAO_CREDENTIALS_DIRECTORY=${OPENBAO_CREDENTIALS_DIRECTORY:-/run/secrets/openbao/keys}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
      - CORS_SUPPORTS_CREDENTIALS=${CORS_SUPPORTS_CREDENTIALS:-true}
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Nginx — reverse proxy towards PHP-FPM
  # ─────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
      network: tickets_back_egress
    container_name: billing_web_v3
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - default
      - tickets_back_proxy
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # OpenBao — key custody (dev mode, no TLS)
  # ─────────────────────────────────────────────
  openbao:
    image: openbao/openbao:2.5.4@sha256:436eaf9778cad75507ff70ea26ace30dcbe15606e619ac3823495663d7f7c115
    container_name: billing_openbao_v3
    cap_add:
      - IPC_LOCK
    volumes:
      - openbao_data_v3:/openbao/data
    networks:
      - key_custody
    environment:
      - BAO_DEV_ROOT_TOKEN_ID=${OPENBAO_ROOT_TOKEN:-root}
      - BAO_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  pgdata_v3:
  openbao_data_v3:
  challenge_redis_data_v3:

networks:
  key_custody:
    internal: true
  challenge_cache:
    internal: true
  tickets_back_proxy:
    external: true
    name: tickets_back_proxy
  tickets_back_egress:
    external: true
    name: tickets_back_egress
